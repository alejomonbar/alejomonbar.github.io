name: Update publication citations

on:
  schedule:
    # Weekly on Monday at 06:15 UTC
    - cron: "15 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-citations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update citations (Semantic Scholar + OpenAlex)
        run: |
          python3 scripts/update_citations_openalex.py _bibliography/papers.bib

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "No citation updates."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add _bibliography/papers.bib
          git commit -m "chore: update publication citation counts from Semantic Scholar + OpenAlex"
          git push
